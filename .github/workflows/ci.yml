name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pip install poetry==2.3.1

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Guard constants imports
        run: bash scripts/check_no_legacy_constants_imports.sh

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: Test suite
        run: poetry run pytest -q

  integration:
    name: Integration E2E
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push'
    env:
      RUN_INTEGRATION_TESTS: "1"
      DATABASE_URL: postgresql+asyncpg://app:app@127.0.0.1:5432/app
      JWT_SECRET: test-secret
      AUTH_REFRESH_STORE_BACKEND: memory
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pip install poetry==2.3.1

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Apply migrations
        run: poetry run alembic upgrade head

      - name: Integration tests
        run: poetry run pytest -q -m integration
